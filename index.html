<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>موظف الشهر | دار الدواء</title>
  <link rel="icon" href="https://www.dadgroup.com/wp-content/uploads/2023/11/uplift-dad-website-05.png" type="image/png" />

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Almarai:wght@400;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />

  <!-- مكتبة تحويل البطاقة إلى صورة PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.11/html-to-image.min.js" defer></script>
  <script src="data.js" defer></script>
  <script src="scripts.js" defer></script>
</head>
<body>
  <div class="background-pattern"></div>

  <nav class="modern-nav">
    <div class="nav-container">
      <div class="nav-logo">
        <img id="company-logo" src="" alt="دار الدواء">
      </div>
      <div id="nav-menu" class="nav-menu"></div>
    </div>
  </nav>

  <header class="hero-section">
    <div class="hero-badge">
      <i class="fa-solid fa-crown"></i>
      <span id="month-label"></span>
    </div>
    <h1 class="hero-title"><span id="hero-title-main"></span> <span id="hero-title-accent" class="accent"></span></h1>
    <p id="hero-tagline" class="hero-tagline"></p>
  </header>

  <main class="main-content">
    <section>
      <div class="counter-strip">
        <div class="counter-item">
          <span class="counter-number" id="total-count">0</span>
          <span class="counter-label">موظف مكرم</span>
        </div>
        <div class="counter-item">
          <span class="counter-number" id="dept-count">0</span>
          <span class="counter-label">قسم مشارك</span>
        </div>
      </div>

      <div id="employees-container" class="employees-grid"></div>
    </section>
  </main>

  <footer class="site-footer">
    <img id="footer-logo" src="" alt="دار الدواء">
    <p id="footer-text"></p>
  </footer>

  <div class="toast" id="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span id="toast-msg">تم تنزيل البطاقة بنجاح</span>
  </div>
</body>
</html>
