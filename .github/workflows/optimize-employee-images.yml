name: Optimize employee portraits (PNG to transparent WebP)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Mar/*.png"
      - "Mar/**/*.png"
      - "data.js"
      - "tools/optimize_images.py"
      - ".github/workflows/optimize-employee-images.yml"

permissions:
  contents: write

concurrency:
  group: optimize-employee-portraits
  cancel-in-progress: false

jobs:
  optimize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/requirements-images.txt
      - name: Install image processing
        run: python -m pip install -r tools/requirements-images.txt
      - name: Remove backgrounds and create WebP
        run: python tools/optimize_images.py
      - name: Publish optimized files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "Mar/*.webp"
          if ! git diff --cached --quiet; then
            git commit -m "Generate optimized transparent WebP employee portraits"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
